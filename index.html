<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Modern PWA capability -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'self';
          script-src 'self' 'unsafe-inline';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data:;
          connect-src 'self';
          manifest-src 'self';
          worker-src 'self';
          object-src 'none';
          base-uri 'self';
          form-action 'self';
        ">

  <!-- Manifest -->
  <link rel="manifest" href="./manifest.json">

  <!-- Icons -->
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="icon" href="./assets/icon-192.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="./css/styles.css">

  <title>Childcare Roster PWA</title>
</head>

<body>

  <!-- HEADER -->
  <header class="sc-header">
    <h1>Weekly Availability</h1>
    <p class="sc-subtitle">Submit your availability securely</p>
  </header>

  <!-- FORM -->
  <main>
    <form id="sc-form" autocomplete="off">

      <section class="sc-section">
        <h2>Your Details</h2>

        <label for="sc-managerEmail">Manager Email</label>
        <input id="sc-managerEmail" type="email" required>

        <label for="sc-name">Your Name</label>
        <input id="sc-name" type="text" required>

        <label for="sc-phone">Phone Number</label>
        <input id="sc-phone" type="text" required>

        <label for="sc-notes">Notes (optional)</label>
        <textarea id="sc-notes" maxlength="500"></textarea>
      </section>

      <section class="sc-section">
        <h2>Availability</h2>

        <table class="sc-table">
          <thead>
            <tr>
              <th>Day</th>
              <th>Start</th>
              <th>End</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="sc-table-body"></tbody>
        </table>
      </section>

      <button id="sc-submit" class="sc-btn-primary">Submit Availability</button>
    </form>
  </main>

  <!-- SUCCESS SCREEN -->
  <section id="sc-success" class="hidden sc-success-screen">
    <h2>Availability Submitted</h2>
    <p>Your availability has been saved and emailed.</p>
    <button onclick="location.reload()" class="sc-btn-secondary">Submit Another</button>
  </section>

  <!-- TOASTS -->
  <div id="sc-toasts" class="sc-toast-container"></div>

  <!-- APP LOGIC -->
  <script src="./js/app.js"></script>

  <!-- SERVICE WORKER REGISTRATION -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .catch(err => console.warn('SW registration failed:', err));
    }
  </script>

</body>
</html>
