<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Childcare Availability Form</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0d0900" />

  <!-- iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="apple-touch-icon" href="./assets/icon-192.png" />

  <!-- Styles -->
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>

  <!-- HEADER -->
  <header class="sc-header">
    <h1>Weekly Availability</h1>
    <p class="sc-subtitle">Submit your availability for the upcoming roster</p>
  </header>

  <!-- STAFF DETAILS -->
  <section class="sc-section">
    <h2>Your Details</h2>

    <label>Name</label>
    <input id="sc-name" type="text" placeholder="Your full name" />

    <label>Phone</label>
    <input id="sc-phone" type="text" placeholder="Mobile number" />

    <label>Email</label>
    <input id="sc-email" type="email" placeholder="Your email address" />

    <label>Notes (optional)</label>
    <textarea id="sc-notes" rows="3" placeholder="Anything the manager should know"></textarea>
  </section>

  <!-- AVAILABILITY TABLE -->
  <section class="sc-section">
    <h2>Your Availability</h2>
    <table class="sc-table" id="sc-table"></table>
  </section>

  <!-- BUTTONS -->
  <section class="sc-section">
    <button id="sc-submit" class="sc-btn-primary">Submit Availability</button>
    <button id="sc-share" class="sc-btn-secondary">Share JSON</button>
  </section>

  <!-- SUCCESS SCREEN -->
  <section id="sc-success" class="sc-success-screen hidden">
    <h2>Thank you!</h2>
    <p>Your availability has been submitted.</p>
  </section>

  <!-- TOASTS -->
  <div class="sc-toast-container" id="sc-toast-container"></div>

  <!-- Scripts -->
  <script src="./js/app.js"></script>
  <script>
    // Register service worker
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./service-worker.js");
    }
  </script>

</body>
</html>
